# SPDX-License-Identifier: GPL-3.0-or-later
#
# Escape Pod — the Cargo workspace (PLAN P-005; PRD "Architecture").
#
#   escapepod-core   the pure tap/hold engine: `step(event, now)`, no I/O
#   escapepod-evdev  the primary backend: evdev read + exclusive grab, uinput
#   escapepod-x11    the fallback backend: XRecord observe, XTest inject
#   escapepod        the binary: CLI, config, the poll(2) loop

[workspace]
resolver = "3"
members = [
  "crates/escapepod-core",
  "crates/escapepod-evdev",
  "crates/escapepod-x11",
  "crates/escapepod",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV: 1.88.0 — edition 2024 needs 1.85; 1.88 adds let-chains, which the
# engine's state machine uses. The release toolchain is pinned separately by
# flake.lock (Standard §24.2); CI checks the MSRV in its own job.
rust-version = "1.88.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/Spacecraft-Software/Escapepod"
homepage = "https://EscapePod.SpacecraftSoftware.org/"
authors = ["Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"]
publish = false

[workspace.dependencies]
escapepod-core = { path = "crates/escapepod-core" }
escapepod-evdev = { path = "crates/escapepod-evdev" }
escapepod-x11 = { path = "crates/escapepod-x11" }
# Runtime dependencies, qualified in DEPENDENCIES.md (gate G2, Standard §24).
# Every one is pinned to the minor version that record qualified.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
evdev = { version = "0.13.2", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
nix = { version = "0.29.0", default-features = false, features = ["fs", "inotify", "poll", "signal", "socket", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
x11rb = { version = "0.14.0", default-features = false, features = ["record", "xtest"] }
# Test-only dependencies (not in the trust path, §24.1).
assert_cmd = "2.2.2"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
jsonschema = { version = "0.60.2", default-features = false }

[workspace.lints.rust]
# §3.1 stability: memory safety is the primary lever. No unsafe anywhere; the
# device I/O goes through the safe APIs of the evdev and x11rb crates. A crate
# that ever needs unsafe lowers this for itself, with a COMPLIANCE.md row.
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# Stability (§3.1): no unwrap/expect/panic! on fallible production paths —
# denied, not warned; clippy.toml exempts test code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Restriction-group lints (microsoft-rust-guidelines M-STATIC-VERIFICATION).
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
literal_string_with_formatting_args = "allow"
# The duplicates come from upstream (serde_derive on syn 3, clap_derive on
# syn 2) and cannot be resolved here; cargo-deny reports them as warnings
# and DEPENDENCIES.md checks the runtime graph has none.
multiple_crate_versions = "allow"

# --- Release profile (Standard §3.2 / §3.2.1: every flag noted) --------------
[profile.release]
opt-level = 3
# APPLIED: fat LTO across the whole graph. rustc drives its own LLVM LTO, so
# the NixOS GCC-LTO-plugin caveat of §3.2.1 does not arise and no -fuse-ld is
# needed.
lto = "fat"
# APPLIED: one codegen unit — best code, slower builds; release only.
codegen-units = 1
# APPLIED: strip symbols — the binary-size row measures the stripped artifact.
strip = true
# PINNED DELIBERATELY: panic = "unwind" (the default, written out so it is not
# "optimised" to abort). Releasing every grab and held key on a panic
# (ESC-SRS-047) runs in the panic hook and in Drop guards, which need unwinding.
panic = "unwind"
# NOT APPLIED: -C target-cpu=native. Packaged binaries must run on any x86-64;
# the latency benchmark may set it in RUSTFLAGS and says so (§3.2.1).
# NOT APPLIED: PGO — no reference workload is committed yet (G2, §22.4).
