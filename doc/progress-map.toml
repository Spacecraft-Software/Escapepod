#
# The progress map: every PLAN.md work package tied to the
# doc/requirements.toml rows that decide whether it is done. tools/progress.nu
# reads it to check the PLAN ticks against the requirement statuses.
#
# Rule (PLAN.md "Done rule"): a work package with `requirements` is done when
# every one of them is `verified`. A package with `rule = "landed"` has no
# requirement of its own (a gate, tooling or a test harness); it is done when
# it has landed on main, which its PLAN.md tick records, and `reason` says why.

