# SPDX-FileCopyrightText: 2026 Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>
# SPDX-License-Identifier: GPL-3.0-or-later
#
# The Escape Pod requirement set: the source of doc/requirements.texi (the
# Category B SRS, Standard §19.3 and §20) and of the §21.3 traceability
# matrix (tools/trace.nu). Edit this file, then run `nu tools/srs.nu`; CI
# fails when the rendered chapter is stale.
#
# Text uses `backticks` for code, file and option names; srs.nu renders them
# as @code{}. `10^7` renders as a superscript.
#
# id:        ESC-SRS-NNN, permanent, never reused (§20.3)
# milestone: M0..M6, as sequenced in PRD.md
# priority:  mandatory | expected | optional                     (§20.3)
# method:    test | analysis | inspection | review-of-design      (§21.1)
# status:    draft | baselined | implemented | verified | withdrawn (§20.3)
# verification: optional detail of how the method is applied
#
# Baseline: G1, 2026-11-01 (COMPLIANCE.md, "Gate records").

[[requirement]]
id = "ESC-SRS-001"
title = "REUSE"
milestone = "M0"
priority = "mandatory"
method = "inspection"
status = "verified"
source = "Standard §4.3"
statement = "The repository shall pass `reuse lint` with exit status 0."
rationale = "Every file needs a machine-readable licence."

[[requirement]]
id = "ESC-SRS-002"
title = "Posture files"
milestone = "M0"
priority = "mandatory"
method = "inspection"
status = "verified"
source = "Standard §5.2"
statement = "The repository shall carry `README.md`, `NOTICE.md`, `CONTRIBUTING.md`, `LICENSE`, and `LICENSES/` at its root."
rationale = "The project posture is stated where a reader looks first."

[[requirement]]
id = "ESC-SRS-003"
title = "Agent context files"
milestone = "M0"
priority = "mandatory"
method = "inspection"
status = "verified"
source = "Standard §5.7; CLI Standard rule 4"
statement = "The repository shall carry `AGENTS.md`, `CLAUDE.md`, and `SKILL.md` at its root."
rationale = "Agents load project invariants from these files."

[[requirement]]
id = "ESC-SRS-004"
title = "Category declared"
milestone = "M0"
priority = "mandatory"
method = "inspection"
status = "verified"
source = "Standard §19.2"
statement = "`README.md`, `AGENTS.md`, and the `PROJECTS.md` registry shall each declare assurance Category B."
rationale = "The category decides the evidence owed."

[[requirement]]
id = "ESC-SRS-005"
title = "Security policy"
milestone = "M0"
priority = "mandatory"
method = "inspection"
status = "verified"
source = "Standard §26"
statement = "The repository shall carry a `SECURITY.md` naming the reporting channel, acknowledgement target, scope, supported versions, disclosure terms, and credit policy."
rationale = "The daemon handles every keystroke, so a reporting path is needed."

[[requirement]]
id = "ESC-SRS-006"
title = "Tailoring register"
milestone = "M0"
priority = "mandatory"
method = "inspection"
status = "verified"
source = "Standard §19.5"
statement = "The repository shall carry a `COMPLIANCE.md` holding the §19.5 tailoring register."
rationale = "Category B records tailoring in a dedicated file."

[[requirement]]
id = "ESC-SRS-007"
title = "CI gate"
milestone = "M0"
priority = "mandatory"
method = "inspection"
status = "verified"
source = "Standard §3.3, §24.2"
statement = "The CI pipeline shall block a merge unless `cargo fmt --check`, `cargo clippy --all-targets --all-features --locked -- -D warnings`, `cargo test`, `cargo audit`, and `cargo deny check` each exit with status 0."
rationale = "Defects and vulnerable dependencies are caught before merge."

[[requirement]]
id = "ESC-SRS-008"
title = "Text format"
milestone = "M0"
priority = "mandatory"
method = "test"
status = "verified"
source = "Standard §6.5"
statement = "The CI pipeline shall fail when a tracked text file contains a carriage return byte."
rationale = "Line endings stay LF across contributors."

[[requirement]]
id = "ESC-SRS-009"
title = "Hold key at once"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-005"
statement = "When a dual-role key is pressed, the engine shall emit the press of its hold key in the output for that same input event."
rationale = "Pass-through adds no delay to modifier use."

[[requirement]]
id = "ESC-SRS-010"
title = "Tap on lone quick release"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "When a dual-role key that is not used is released no later than the tap timeout after its press, the engine shall emit, after the release of the hold key, one press and one release of the tap key."
rationale = "This is the core behaviour."

[[requirement]]
id = "ESC-SRS-011"
title = "No tap after another key"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "When another key is pressed between the press and the release of a dual-role key, the engine shall not emit the tap key for that release."
rationale = "A modifier chord must not also send the tap key."

[[requirement]]
id = "ESC-SRS-012"
title = "No tap after a pointer button"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "When a pointer button is pressed between the press and the release of a dual-role key, the engine shall not emit the tap key for that release."
rationale = "Xcape sent a stray Escape after Control-click."

[[requirement]]
id = "ESC-SRS-013"
title = "No tap after the timeout"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "When a dual-role key is released later than the tap timeout after its press, the engine shall not emit the tap key for that release."
rationale = "A long hold that is abandoned is not a tap."

[[requirement]]
id = "ESC-SRS-014"
title = "Own autorepeat"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "The engine shall not treat an autorepeat event of a dual-role key as a press of another key."
rationale = "Kernel autorepeat of the held key would otherwise cancel every tap."

[[requirement]]
id = "ESC-SRS-015"
title = "Overlapping dual-role keys"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "When a second dual-role key is pressed while a first is held, the engine shall mark the first as used."
rationale = "Two dual-role keys held together form a chord."

[[requirement]]
id = "ESC-SRS-016"
title = "Remap"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "When a remap source key produces a press, release, or autorepeat event, the engine shall emit the event of the same kind for the remap target key."
rationale = "Caps Lock to Control is the usual companion of a dual-role Control."

[[requirement]]
id = "ESC-SRS-017"
title = "Pass-through"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-005"
statement = "The engine shall emit every event of a key that is not managed unchanged and in input order."
rationale = "Escape Pod must be invisible for the rest of the keyboard."

[[requirement]]
id = "ESC-SRS-018"
title = "Balanced output"
milestone = "M1"
priority = "mandatory"
method = "test"
verification = "property-based, over generated sequences"
status = "baselined"
source = "ESC-NEED-003"
statement = "For every input sequence in which each pressed key is later released, the engine shall emit a release for every key press it emitted."
rationale = "An unbalanced press is a stuck key."

[[requirement]]
id = "ESC-SRS-019"
title = "Default tap timeout"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "When the configuration sets no tap timeout, the engine shall use a tap timeout of 200 ms."
rationale = "200 ms covers a deliberate tap and excludes an abandoned hold."

[[requirement]]
id = "ESC-SRS-020"
title = "Protected keys"
milestone = "M1"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-007; Standard §10"
statement = "The engine shall emit every event of a protected key unchanged."
rationale = "Assistive-technology modifiers are never captured."

[[requirement]]
id = "ESC-SRS-021"
title = "No unsafe in the engine"
milestone = "M1"
priority = "mandatory"
method = "inspection"
status = "baselined"
source = "Standard §3.1"
statement = "The `escapepod-core` crate shall declare `#![forbid(unsafe_code)]`."
rationale = "The engine is the trust core and needs no unsafe code."

[[requirement]]
id = "ESC-SRS-022"
title = "Command tree"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006; CLI Standard rule 7"
statement = "The CLI shall provide the commands `daemon run`, `daemon status`, `event monitor`, `device list`, `config check`, `schema`, and `describe`."
rationale = "A fixed noun-verb tree keeps the surface predictable."

[[requirement]]
id = "ESC-SRS-023"
title = "Global flags"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "CLI Standard v1.1.0 §3"
statement = "The CLI shall accept every global flag of CLI Standard §3 with the name, type, and effect that section defines."
rationale = "Flags behave the same across Spacecraft Software tools."

[[requirement]]
id = "ESC-SRS-024"
title = "JSON envelope"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006"
statement = "When JSON output is selected, every data-returning command shall write exactly one JSON document of the CLI Standard §6 envelope shape to standard output."
rationale = "Agents parse one stable shape."

[[requirement]]
id = "ESC-SRS-025"
title = "Structured errors"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006; agentic CLI §3"
statement = "When a command fails in machine mode, the CLI shall write to standard error one JSON error object whose `hint` field holds a command the caller can run without elevated privileges, or the literal prefix `human:` followed by the action a person must take."
rationale = "A runnable hint ends guess-and-retry loops."

[[requirement]]
id = "ESC-SRS-026"
title = "Agent detection"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006; CLI Standard §5"
statement = "When the process runs in an agent environment, the CLI shall select JSON output."
rationale = "Harnesses set descriptive values, not `1`."

[[requirement]]
id = "ESC-SRS-090"
title = "Agent colour"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006; CLI Standard §5"
statement = "When the process runs in an agent environment, the CLI shall emit no ANSI colour sequence."
rationale = "Colour codes are noise in an agent's context."

[[requirement]]
id = "ESC-SRS-091"
title = "Agent prompts"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006; CLI Standard §5"
statement = "When the process runs in an agent environment, the CLI shall not prompt for input."
rationale = "An agent cannot answer a prompt and would hang."

[[requirement]]
id = "ESC-SRS-027"
title = "Exit codes"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "CLI Standard §4"
statement = "The CLI shall exit with the codes of CLI Standard §4."
rationale = "Exit status is an agent's control flow."

[[requirement]]
id = "ESC-SRS-095"
title = "Code 6 reserved"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "The CLI shall not exit with code 6 except after an emergency release."
rationale = "The service unit treats code 6 as do-not-restart."

[[requirement]]
id = "ESC-SRS-028"
title = "Version attribution"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §15"
statement = "The `--version` output shall include the line `Maintained by Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>` and the project URL."
rationale = "Attribution travels with the binary."

[[requirement]]
id = "ESC-SRS-029"
title = "Config location"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006"
statement = "The CLI shall read the configuration from the path given by `--config`, else from `$XDG_CONFIG_HOME/escapepod/config.toml` for a session run, else from `/etc/escapepod/config.toml`."
rationale = "One documented search order."

[[requirement]]
id = "ESC-SRS-030"
title = "Unknown keys"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "When the configuration contains a key the schema does not define, the CLI shall exit with code 2."
rationale = "A typo must not silently disable a mapping."

[[requirement]]
id = "ESC-SRS-092"
title = "Unknown key location"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006"
statement = "When the configuration contains a key the schema does not define, the CLI shall report the line and column of that key."
rationale = "The user finds the typo without searching."

[[requirement]]
id = "ESC-SRS-031"
title = "Tap timeout range"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "When a tap timeout outside 50 ms to 2000 ms inclusive is given, the CLI shall exit with code 2."
rationale = "Values outside the range make tapping impossible or unpredictable."

[[requirement]]
id = "ESC-SRS-032"
title = "xcape mapping grammar"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-008"
statement = "The CLI shall accept `--map` with the xcape grammar `KEY=TAP[;KEY=TAP]...` and apply it as dual-role mappings with KEY as both the physical key and the hold key."
rationale = "Xcape users keep their mapping string."

[[requirement]]
id = "ESC-SRS-033"
title = "Tap timeout flag"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-008"
statement = "The CLI shall accept `--tap-timeout` in milliseconds, overriding the configuration value."
rationale = "Matches xcape's `-t`."

[[requirement]]
id = "ESC-SRS-034"
title = "Device match rules"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "The CLI shall accept per-device rules matching a device by name or by vendor and product identifier."
rationale = "An external keyboard may need a different mapping."

[[requirement]]
id = "ESC-SRS-035"
title = "Config check"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "The `config check` command shall validate the configuration without opening any input device or creating any virtual device."
rationale = "A configuration is tested without risking the keyboard."

[[requirement]]
id = "ESC-SRS-036"
title = "Device list"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-004"
statement = "The `device list` command shall report each input device's name, vendor identifier, product identifier, path, kind, and match status without read access to any event device."
rationale = "Discovery must not need keylogging rights."

[[requirement]]
id = "ESC-SRS-037"
title = "Run confirmation"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003; agentic CLI §7"
statement = "When standard output is not a terminal, or the process runs in an agent environment, the `daemon run` command shall exit with code 2 unless `--yes` is given."
rationale = "An agent must not grab the keyboard by accident."

[[requirement]]
id = "ESC-SRS-038"
title = "Screen-reader modifier"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-007; Standard §10"
statement = "When a session run finds an Orca modifier key named in the configuration, the daemon shall treat that key as protected."
rationale = "Orca's laptop layout uses Caps Lock as its modifier."

[[requirement]]
id = "ESC-SRS-093"
title = "Screen-reader warning"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-007"
statement = "When a session run finds an Orca modifier key named in the configuration, the daemon shall emit a warning diagnostic naming that key."
rationale = "The user learns why the mapping is inactive."

[[requirement]]
id = "ESC-SRS-039"
title = "Dry run"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003; CLI Standard rule 3"
statement = "The `daemon run --dry-run` command shall report the devices it would grab and the mappings it would apply, then exit with code 0."
rationale = "The plan is inspectable before the keyboard is taken."

[[requirement]]
id = "ESC-SRS-094"
title = "Dry run grabs nothing"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003; CLI Standard rule 3"
statement = "The `daemon run --dry-run` command shall not grab any input device."
rationale = "A dry run must be free of the lockout risk."

[[requirement]]
id = "ESC-SRS-040"
title = "Accessible output"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §18"
statement = "When accessible mode is active, the `event monitor` command shall write one complete line per event and no cursor-movement escape sequence."
rationale = "Screen readers read linear output."

[[requirement]]
id = "ESC-SRS-041"
title = "Schema"
milestone = "M2"
priority = "mandatory"
method = "test"
status = "baselined"
source = "CLI Standard rule 4"
statement = "The `schema` command shall write a document that validates as JSON Schema Draft 2020-12."
rationale = "The schema drops into LLM tool definitions."

[[requirement]]
id = "ESC-SRS-042"
title = "Provider schema formats"
milestone = "M2"
priority = "optional"
method = "test"
status = "baselined"
source = "agentic CLI §5"
statement = "The `schema` command should accept `--format` values `anthropic`, `openai`, `gemini`, and `mcp`."
rationale = "Saves an adapter step per provider."

[[requirement]]
id = "ESC-SRS-043"
title = "Output before grab"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "When the virtual output device cannot be created, the daemon shall exit with code 4 before grabbing any input device."
rationale = "A grab with no output is a dead keyboard."

[[requirement]]
id = "ESC-SRS-044"
title = "Exclusive grab"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-002"
statement = "The daemon shall grab every keyboard matched by the configuration exclusively."
rationale = "Without the grab both the original and the mapped events reach applications."

[[requirement]]
id = "ESC-SRS-045"
title = "Own devices excluded"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "The daemon shall not open for reading any virtual device created by an Escape Pod process."
rationale = "Reading its own output creates a feedback loop."

[[requirement]]
id = "ESC-SRS-046"
title = "Release on signal"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "When the daemon receives `SIGTERM` or `SIGINT`, it shall emit a release for every key it holds down on the virtual device within 100 ms and before exiting."
rationale = "A stuck Control outlives the process otherwise."

[[requirement]]
id = "ESC-SRS-047"
title = "Release on panic"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "When the daemon panics, it shall emit a release for every key it holds down on the virtual device before the process ends."
rationale = "A defect must not leave a stuck key."

[[requirement]]
id = "ESC-SRS-048"
title = "Emergency chord"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "When every key of the emergency chord is held at once, the daemon shall release every grab within 100 ms."
rationale = "A way out that works when the mapping itself is broken."

[[requirement]]
id = "ESC-SRS-096"
title = "Emergency exit code"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "After an emergency release, the daemon shall exit with code 6."
rationale = "The supervisor must tell a deliberate escape from a crash."

[[requirement]]
id = "ESC-SRS-049"
title = "Configurable chord"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §10"
statement = "The configuration shall be able to replace the default emergency chord of Backspace, Escape, and Enter."
rationale = "Key bindings are remappable."

[[requirement]]
id = "ESC-SRS-050"
title = "Device fault isolation"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003; Standard §3.1"
statement = "When reading from a grabbed device fails, the daemon shall release that device's grab."
rationale = "One faulty keyboard must not take the others down."

[[requirement]]
id = "ESC-SRS-097"
title = "Device fault warning"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006"
statement = "When reading from a grabbed device fails, the daemon shall emit a warning diagnostic naming that device."
rationale = "A silently released keyboard looks like a broken mapping."

[[requirement]]
id = "ESC-SRS-098"
title = "Other devices continue"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003; Standard §3.1"
statement = "When reading from a grabbed device fails, the daemon shall continue serving every other grabbed device."
rationale = "One faulty keyboard must not take the others down."

[[requirement]]
id = "ESC-SRS-051"
title = "Hotplug"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-002"
statement = "When a keyboard matching the configuration is connected, the daemon shall grab it within 1 s."
rationale = "Docked and Bluetooth keyboards come and go."

[[requirement]]
id = "ESC-SRS-052"
title = "Removal"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "When a grabbed device is removed, the daemon shall emit a release for every virtual-device key held down because of that device."
rationale = "Unplugging mid-chord must not leave a stuck modifier."

[[requirement]]
id = "ESC-SRS-053"
title = "Pointers read without grab"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-001"
statement = "The daemon shall read pointer button events from pointer devices without grabbing them."
rationale = "ESC-SRS-012 needs pointer presses; grabbing would take the pointer away."

[[requirement]]
id = "ESC-SRS-054"
title = "Reload"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006"
statement = "When the daemon receives `SIGHUP` and the configuration validates, it shall apply the new configuration."
rationale = "Changes apply without dropping the keyboard."

[[requirement]]
id = "ESC-SRS-055"
title = "Failed reload"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "When the daemon receives `SIGHUP` and the configuration does not validate, it shall keep the previous configuration."
rationale = "A typo during reload must not strand the user."

[[requirement]]
id = "ESC-SRS-099"
title = "Failed reload warning"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006"
statement = "When the daemon receives `SIGHUP` and the configuration does not validate, it shall emit a warning diagnostic naming the first error."
rationale = "The user learns the reload did not apply."

[[requirement]]
id = "ESC-SRS-056"
title = "Grabs kept across reload"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "During a reload, the daemon shall keep the grab of every device that the new configuration still matches."
rationale = "A release-and-regrab window passes raw keys through."

[[requirement]]
id = "ESC-SRS-057"
title = "Idle"
milestone = "M3"
priority = "mandatory"
method = "analysis"
status = "baselined"
source = "ESC-NEED-005"
statement = "While no input event, signal, hotplug event, or socket connection arrives, the daemon shall not wake."
rationale = "An idle daemon costs no power."

[[requirement]]
id = "ESC-SRS-058"
title = "Key data destination"
milestone = "M3"
priority = "mandatory"
method = "review-of-design"
status = "baselined"
source = "ESC-NEED-004"
statement = "The daemon shall write key event data only to its virtual device and to the status socket."
rationale = "Keystrokes never land in logs or files."

[[requirement]]
id = "ESC-SRS-059"
title = "Socket access"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-004"
statement = "The daemon shall create its status socket with mode `0660` and group `escapepod-ctl`."
rationale = "Event timing alone leaks typing cadence, so access is granted explicitly."

[[requirement]]
id = "ESC-SRS-060"
title = "Socket redaction"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-004"
statement = "The daemon shall not write the key code of a key that is not managed to the status socket."
rationale = "The socket must not become a keylogger."

[[requirement]]
id = "ESC-SRS-061"
title = "Monitor default"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-004"
statement = "The `event monitor` command shall report events of keys that are not managed as `other`, without a key code."
rationale = "The default view is safe to paste into a bug report."

[[requirement]]
id = "ESC-SRS-062"
title = "All-keys guard"
milestone = "M3"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-004; agentic CLI §7"
statement = "When standard output is not a terminal, or the process runs in an agent environment, the `event monitor --all-keys` command shall exit with code 4."
rationale = "Full keystroke output must not reach a pipe or an agent's context."

[[requirement]]
id = "ESC-SRS-063"
title = "Backend auto-selection"
milestone = "M4"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-002"
statement = "When `--backend` is absent or `auto`, the daemon shall select the evdev backend if it can read a matched keyboard and write `/dev/uinput`, else the X11 backend if `DISPLAY` is set, else exit with code 4."
rationale = "The best available backend is used without configuration."

[[requirement]]
id = "ESC-SRS-064"
title = "Backend override"
milestone = "M4"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006"
statement = "The daemon shall use the backend named by `--backend evdev` or `--backend x11`."
rationale = "The choice can be forced for testing."

[[requirement]]
id = "ESC-SRS-100"
title = "Forced backend unavailable"
milestone = "M4"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006"
statement = "When the backend named by `--backend` is unavailable, the daemon shall exit with code 4."
rationale = "A forced backend must not silently fall back."

[[requirement]]
id = "ESC-SRS-065"
title = "X11 tap"
milestone = "M4"
priority = "mandatory"
method = "test"
verification = "under Xvfb"
status = "baselined"
source = "ESC-NEED-002"
statement = "On the X11 backend, when the conditions of ESC-SRS-010 hold, the daemon shall inject one press and one release of the tap key."
rationale = "The X11 fallback keeps the core behaviour."

[[requirement]]
id = "ESC-SRS-066"
title = "X11 rejects remaps"
milestone = "M4"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-002"
statement = "On the X11 backend, when the configuration contains a remap, the daemon shall exit with code 2."
rationale = "X RECORD cannot suppress a key, so a remap cannot be honoured."

[[requirement]]
id = "ESC-SRS-101"
title = "X11 remap hint"
milestone = "M4"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006; agentic CLI §3"
statement = "On the X11 backend, when the configuration contains a remap, the error's hint shall name `setxkbmap -option`."
rationale = "Points the user at the X11-native way to remap."

[[requirement]]
id = "ESC-SRS-067"
title = "X11 needs no device access"
milestone = "M4"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-002; ESC-NEED-004"
statement = "The X11 backend shall run without read access to any event device and without write access to `/dev/uinput`."
rationale = "The fallback exists for sessions without device access."

[[requirement]]
id = "ESC-SRS-068"
title = "X11 connection loss"
milestone = "M4"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "When the X server connection is lost, the daemon shall exit with code 1."
rationale = "A dead connection must be visible to the supervisor."

[[requirement]]
id = "ESC-SRS-102"
title = "X11 loss diagnostic"
milestone = "M4"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-006"
statement = "When the X server connection is lost, the daemon shall emit an error diagnostic naming the display."
rationale = "The log says why the daemon stopped."

[[requirement]]
id = "ESC-SRS-088"
title = "X11 injects taps only"
milestone = "M4"
priority = "mandatory"
method = "test"
verification = "under Xvfb"
status = "baselined"
source = "ESC-NEED-001"
statement = "On the X11 backend, the daemon shall inject tap-key events and no other events."
rationale = "The physical hold key already reached the X server, so injecting it again would double it."

[[requirement]]
id = "ESC-SRS-069"
title = "Service account"
milestone = "M5"
priority = "mandatory"
method = "inspection"
status = "baselined"
source = "ESC-NEED-004"
statement = "The service unit shall run the daemon as the `escapepod` system account."
rationale = "Keylogging rights stay off the login account."

[[requirement]]
id = "ESC-SRS-070"
title = "Scoped udev rules"
milestone = "M5"
priority = "mandatory"
method = "inspection"
status = "baselined"
source = "ESC-NEED-004"
statement = "The shipped udev rules shall grant event-device read access and `/dev/uinput` write access to group `escapepod` and to no other group."
rationale = "Device access is granted to the daemon alone."

[[requirement]]
id = "ESC-SRS-071"
title = "No input group"
milestone = "M5"
priority = "mandatory"
method = "inspection"
status = "baselined"
source = "ESC-NEED-004"
statement = "The packaging shall not add any login account to the `input` group."
rationale = "Membership would let every program the user runs read every keyboard."

[[requirement]]
id = "ESC-SRS-072"
title = "Service sandbox"
milestone = "M5"
priority = "mandatory"
method = "inspection"
status = "baselined"
source = "Standard §3.3"
statement = "The service unit shall restrict the daemon to the `AF_UNIX` and `AF_NETLINK` address families."
rationale = "A keystroke-handling process has no use for a network."

[[requirement]]
id = "ESC-SRS-073"
title = "No restart after emergency"
milestone = "M5"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-003"
statement = "The service unit shall not restart the daemon after exit code 6."
rationale = "A restart would re-grab the keyboard the user just freed."

[[requirement]]
id = "ESC-SRS-074"
title = "NixOS module"
milestone = "M5"
priority = "mandatory"
method = "test"
verification = "NixOS VM test"
status = "baselined"
source = "ESC-NEED-002"
statement = "The project shall ship a NixOS module `services.escapepod` that installs the service, the udev rules, the account, and the configuration."
rationale = "Steelbore OS Bravais is NixOS."

[[requirement]]
id = "ESC-SRS-075"
title = "Guix package"
milestone = "M5"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §5.5"
statement = "`packaging/guix.scm` shall build the release with `guix build -f`."
rationale = "Distribution requirement."

[[requirement]]
id = "ESC-SRS-076"
title = "Nix package"
milestone = "M5"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §5.5"
statement = "`packaging/default.nix` shall build the release."
rationale = "Distribution requirement."

[[requirement]]
id = "ESC-SRS-077"
title = "Arch package"
milestone = "M5"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §5.5"
statement = "`packaging/PKGBUILD` shall build the release with `makepkg`."
rationale = "Distribution requirement."

[[requirement]]
id = "ESC-SRS-078"
title = "Manual"
milestone = "M5"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §8"
statement = "`doc/escapepod.texi` shall build to Info, HTML, and PDF with zero errors and zero warnings."
rationale = "The manual is the canonical reference."

[[requirement]]
id = "ESC-SRS-089"
title = "Interface control document"
milestone = "M5"
priority = "mandatory"
method = "inspection"
status = "baselined"
source = "Standard §23.2"
statement = "`doc/escapepod.texi` shall carry an `Interfaces` node recording, for each interface, its identity, version, contract, error behaviour, stability class, committed schema, and known consumers."
rationale = "Category B ships an ICD."

[[requirement]]
id = "ESC-SRS-079"
title = "Latency budget"
milestone = "M6"
priority = "mandatory"
method = "test"
verification = "benchmark"
status = "baselined"
source = "ESC-NEED-005; Standard §22"
statement = "The evdev backend shall add no more than 1 ms at the 99th percentile between reading an input event and writing the corresponding output event, on the reference machine."
rationale = "Added delay above this is felt as lag."

[[requirement]]
id = "ESC-SRS-080"
title = "Memory budget"
milestone = "M6"
priority = "mandatory"
method = "test"
status = "baselined"
source = "ESC-NEED-005; Standard §22"
statement = "The daemon shall hold a resident set of no more than 8 MiB on the reference machine."
rationale = "A resident daemon stays small."

[[requirement]]
id = "ESC-SRS-081"
title = "Config parser fuzzing"
milestone = "M6"
priority = "mandatory"
method = "test"
verification = "fuzzing"
status = "baselined"
source = "Standard §21.2"
statement = "The configuration parser shall return a result without panicking for every input of a fuzzing campaign of at least 10^7 executions."
rationale = "Every input parser is fuzzed at Category B."

[[requirement]]
id = "ESC-SRS-082"
title = "Mapping grammar fuzzing"
milestone = "M6"
priority = "mandatory"
method = "test"
verification = "fuzzing"
status = "baselined"
source = "Standard §21.2"
statement = "The `--map` parser shall return a result without panicking for every input of a fuzzing campaign of at least 10^7 executions."
rationale = "Every input parser is fuzzed at Category B."

[[requirement]]
id = "ESC-SRS-083"
title = "Coverage"
milestone = "M6"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §21.2"
statement = "The test suite shall reach at least 80% line coverage of the workspace's own code."
rationale = "Category B evidence floor."

[[requirement]]
id = "ESC-SRS-084"
title = "Mutation triage"
milestone = "M6"
priority = "mandatory"
method = "inspection"
status = "baselined"
source = "Standard §21.2"
statement = "Every mutant surviving a `cargo mutants` run shall be killed by a test or carry a written justification."
rationale = "Shows the tests would notice a defect."

[[requirement]]
id = "ESC-SRS-085"
title = "Traceability"
milestone = "M6"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §21.3"
statement = "The CI pipeline shall generate the requirement-to-test traceability matrix and fail on an unverified requirement or an unknown identifier."
rationale = "A hand-kept matrix goes stale."

[[requirement]]
id = "ESC-SRS-086"
title = "SBOM"
milestone = "M6"
priority = "mandatory"
method = "inspection"
status = "baselined"
source = "Standard §24.3"
statement = "Each release shall ship an SBOM generated from the locked inputs, with a checksum."
rationale = "Users can audit what runs on their keystrokes."

[[requirement]]
id = "ESC-SRS-087"
title = "Clean install"
milestone = "M6"
priority = "mandatory"
method = "test"
status = "baselined"
source = "Standard §21.5, §25.3"
statement = "Each of the three package definitions shall install a working daemon in a clean environment before the release tag is pushed."
rationale = "Validation from installed packaging."
