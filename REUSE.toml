version = 1

# Files that cannot carry inline SPDX tags.
[[annotations]]
path = ["LICENSE", "Cargo.lock", "flake.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Seeds proptest writes when a property fails; committed as regressions.
[[annotations]]
path = ["**/*.proptest-regressions"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The committed JSON Schemas (the ICD's machine-readable half); JSON has no
# comment syntax for an inline header.
[[annotations]]
path = ["schemas/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"
SPDX-License-Identifier = "GPL-3.0-or-later"
